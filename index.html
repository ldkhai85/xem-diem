<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tra cứu điểm</title>
<style>
  :root {
    --nen: #f4f6f9; --the: #fff; --chu: #1d2430; --phu: #5d6b7e; --vien: #dde3ea;
    --nhan: #1f5fae; --nhan-nhat: #e8f0fb; --loi: #b3261e; --tot: #1e7b45;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
         background: var(--nen); color: var(--chu); line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .phu { color: var(--phu); font-size: .9rem; }
  .the { background: var(--the); border: 1px solid var(--vien); border-radius: 12px; padding: 20px; margin-top: 20px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--vien); border-radius: 8px; }
  input:focus { outline: 2px solid var(--nhan); border-color: var(--nhan); }
  button { margin-top: 16px; padding: 10px 20px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px;
           background: var(--nhan); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button.phu-btn { background: transparent; color: var(--nhan); border: 1px solid var(--nhan); }
  .thong-bao { margin-top: 12px; font-size: .95rem; }
  .thong-bao.loi { color: var(--loi); }
  .ho-so h2 { margin: 0; font-size: 1.25rem; }
  .hp { margin-top: 20px; }
  .hp h3 { margin: 0 0 2px; font-size: 1.1rem; }
  .bang { margin-top: 14px; border: 1px solid var(--vien); border-radius: 10px; overflow: hidden; }
  .bang h4 { margin: 0; padding: 10px 14px; background: var(--nhan-nhat); font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 14px; border-top: 1px solid var(--vien); }
  td.so { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.con td:first-child { padding-left: 34px; color: var(--phu); }
  tr.con td { font-size: .92rem; }
  tr.tong td { font-weight: 700; background: #fafbfc; }
  .toi-da { color: var(--phu); font-weight: 400; }
  .nhan-xet { padding: 10px 14px; border-top: 1px solid var(--vien); font-size: .95rem; white-space: pre-wrap; }
  .nhan-xet b { display: block; margin-bottom: 2px; }
  footer { margin-top: 28px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="tieu-de">Tra cứu điểm học phần</h1>
  <div class="phu" id="cap-nhat"></div>

  <form class="the" id="form" autocomplete="off">
    <label for="mssv">Mã sinh viên</label>
    <input id="mssv" inputmode="numeric" placeholder="Ví dụ: 3126410004" required>
    <label for="ngay">Ngày sinh</label>
    <input id="ngay" inputmode="numeric" placeholder="dd/mm/yyyy – ví dụ: 05/09/2008" required>
    <button id="nut" type="submit">Tra cứu</button>
    <div class="thong-bao" id="tb"></div>
  </form>

  <section class="the ho-so" id="ket-qua" hidden></section>

  <footer class="phu">
    Dữ liệu được mã hóa riêng cho từng sinh viên, chỉ mở được bằng đúng mã SV và ngày sinh.<br>
    Thắc mắc về điểm, vui lòng liên hệ giảng viên phụ trách.
  </footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let cauHinh = null;

function chuanNgay(s) {
  let so = (s.match(/\d+/g) || []);
  if (so.length === 1 && so[0].length === 8) so = [so[0].slice(0, 2), so[0].slice(2, 4), so[0].slice(4)];
  if (so.length !== 3 || so[2].length !== 4) return null;
  const [d, m, y] = so.map(Number);
  const t = new Date(y, m - 1, d);
  if (t.getFullYear() !== y || t.getMonth() !== m - 1 || t.getDate() !== d) return null;
  return String(d).padStart(2, "0") + String(m).padStart(2, "0") + String(y);
}

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function hex(buf) { return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }

async function khoa(mssv, ngay) {
  const enc = new TextEncoder();
  const goc = await crypto.subtle.importKey("raw", enc.encode(mssv + "|" + ngay), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(cauHinh.muoi), iterations: cauHinh.so_lap }, goc, 512));
  const ten = hex(await crypto.subtle.digest("SHA-256", bits.slice(0, 32))).slice(0, 32);
  const k = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
  return { ten, k };
}

function el(tag, attrs, ...con) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs || {})) e.setAttribute(a, v);
  for (const c of con) if (c != null) e.append(c instanceof Node ? c : String(c));
  return e;
}

function so(v) {
  if (v === null || v === undefined || v === "") return "—";
  if (typeof v === "number") return v.toLocaleString("vi-VN", { maximumFractionDigits: 2 });
  return String(v);
}

function dongDiem(m, lop) {
  const td2 = el("td", { class: "so" }, so(m.diem));
  if (m.toi_da != null) td2.append(el("span", { class: "toi-da" }, " / " + so(m.toi_da)));
  return el("tr", lop ? { class: lop } : {}, el("td", {}, m.nhan), td2);
}

function veBang(b) {
  const khung = el("div", { class: "bang" }, el("h4", {}, b.ten + (b.ngay ? " – ngày " + b.ngay : "")));
  const t = el("table");
  for (const m of b.muc || []) {
    t.append(dongDiem(m));
    for (const c of m.con || []) t.append(dongDiem(c, "con"));
  }
  if (b.tong) t.append(dongDiem(b.tong, "tong"));
  khung.append(t);
  for (const n of b.nhan_xet || []) khung.append(el("div", { class: "nhan-xet" }, el("b", {}, n.nhan), so(n.noi_dung)));
  return khung;
}

function hienThi(d) {
  const kq = $("ket-qua");
  kq.replaceChildren(
    el("h2", {}, d.ho_ten),
    el("div", { class: "phu" }, "Mã SV: " + d.mssv + " · Cập nhật: " + d.cap_nhat));
  for (const hp of d.hoc_phan) {
    const khoi = el("div", { class: "hp" },
      el("h3", {}, hp.ten_hp + " (" + hp.ma_hp + ")"),
      el("div", { class: "phu" }, [hp.hoc_ky, hp.nhom ? "Nhóm " + hp.nhom : "", hp.giang_vien ? "GV: " + hp.giang_vien : ""]
        .filter(Boolean).join(" · ")));
    for (const b of hp.bang) khoi.append(veBang(b));
    kq.append(khoi);
  }
  const lai = el("button", { type: "button", class: "phu-btn" }, "Tra cứu khác");
  lai.onclick = () => { kq.hidden = true; $("form").hidden = false; $("mssv").value = ""; $("ngay").value = ""; $("mssv").focus(); };
  kq.append(lai);
  $("form").hidden = true;
  kq.hidden = false;
}

async function traCuu(ev) {
  ev.preventDefault();
  const tb = $("tb");
  tb.className = "thong-bao"; tb.textContent = "";
  const mssv = $("mssv").value.replace(/\s/g, "");
  const ngay = chuanNgay($("ngay").value);
  if (!/^\d{6,12}$/.test(mssv)) { tb.className = "thong-bao loi"; tb.textContent = "Mã sinh viên không hợp lệ."; return; }
  if (!ngay) { tb.className = "thong-bao loi"; tb.textContent = "Ngày sinh không hợp lệ – nhập theo dạng dd/mm/yyyy."; return; }
  if (!window.crypto || !crypto.subtle) { tb.className = "thong-bao loi"; tb.textContent = "Trình duyệt không hỗ trợ giải mã (cần mở trang qua https)."; return; }
  $("nut").disabled = true; tb.textContent = "Đang tra cứu...";
  try {
    if (!cauHinh) cauHinh = await (await fetch("cau_hinh.json", { cache: "no-store" })).json();
    const { ten, k } = await khoa(mssv, ngay);
    const r = await fetch("data/" + ten + ".json", { cache: "no-store" });
    if (r.status === 404) throw new Error("khong-thay");
    if (!r.ok) throw new Error("mang");
    const g = await r.json();
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(g.iv) }, k, b64(g.ct));
    hienThi(JSON.parse(new TextDecoder().decode(pt)));
    tb.textContent = "";
  } catch (e) {
    tb.className = "thong-bao loi";
    tb.textContent = e.message === "khong-thay"
      ? "Không tìm thấy kết quả. Kiểm tra lại mã SV và ngày sinh (đúng như trong danh sách lớp)."
      : "Có lỗi khi tải dữ liệu, vui lòng thử lại sau.";
  } finally {
    $("nut").disabled = false;
  }
}

$("form").addEventListener("submit", traCuu);
fetch("cau_hinh.json", { cache: "no-store" }).then(r => r.json()).then(c => {
  cauHinh = c;
  if (c.tieu_de) { $("tieu-de").textContent = c.tieu_de; document.title = c.tieu_de; }
  if (c.cap_nhat) $("cap-nhat").textContent = "Dữ liệu cập nhật lúc " + c.cap_nhat;
}).catch(() => {});
</script>
</body>
</html>
